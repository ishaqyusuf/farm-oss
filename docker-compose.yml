services:
  postgres:
    image: postgres:16-alpine
    container_name: farm-oss-postgres
    environment:
      POSTGRES_DB: farm_oss
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - farm-oss-postgres:/var/lib/postgresql/data

volumes:
  farm-oss-postgres:

