services:
  postgres:
    image: postgres:16-alpine
    container_name: farm-oss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: farm_oss
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farm_oss"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - farm-oss-postgres:/var/lib/postgresql/data

volumes:
  farm-oss-postgres:
