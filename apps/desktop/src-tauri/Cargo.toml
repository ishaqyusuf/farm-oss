[package]
name = "farm-oss-desktop"
version = "0.1.0"
description = "Farm OSS desktop shell"
authors = ["Farm OSS"]
edition = "2024"

[lib]
name = "farm_oss_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"

